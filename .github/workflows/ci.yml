name: CI

# Every main push and every pull request runs the full check set; there are deliberately
# no path filters, so documentation-only commits also get their own successful run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs may be cancelled; main runs always finish so each commit has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Build
        run: npm run build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      # No backend and no cloud credentials: validate checks the configuration only and
      # never touches real resources. The provider comes from the committed lockfile.
      - name: Initialise without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    env:
      IMAGE: sixdegrees:ci
      CONTAINER: sixdegrees-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} --tag "$IMAGE" .
      - name: Start container
        run: docker run --detach --name "$CONTAINER" --env PORT=8080 --publish 127.0.0.1:8080:8080 "$IMAGE"
      - name: Smoke test
        run: >-
          python3 scripts/smoke_test.py
          --base-url http://127.0.0.1:8080
          --expected-version ${{ github.sha }}
          --container "$CONTAINER"
          --timeout 60
      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER" || true
      - name: Remove container
        if: always()
        run: docker rm --force "$CONTAINER" || true
